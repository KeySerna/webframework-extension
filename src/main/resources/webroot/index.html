<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WebFramework - Demo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <img src="/images/logo.png" alt="Logo WebFramework" class="logo">
        <h1>WebFramework - Aplicación de ejemplo</h1>
    </header>

    <section>
        <h2>Saludo</h2>
        <input type="text" id="name" placeholder="Tu nombre">
        <button onclick="greet()">Saludar</button>
        <p id="result"></p>
    </section>

    <section>
        <h2>Valor de Pi</h2>
        <button onclick="getPi()">Obtener Pi</button>
        <p id="piResult"></p>
    </section>

    <section>
        <h2>Cuadrado de un número</h2>
        <input type="number" id="value" placeholder="Número">
        <button onclick="getSquare()">Calcular</button>
        <p id="squareResult"></p>
    </section>

    <script src="/app.js"></script>
</body>
</html>
